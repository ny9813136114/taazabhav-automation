name: Daily Telegram Mandi Bhav Broadcast

# Prices come from taazabhav.com (18 Oct 2026), so the run waits until the
# site has the day's prices (data.gov.in posts ~11:30 IST). The Supabase
# clock (ops/supabase-clock.sql) starts it at 13:00 and 16:00 IST; the
# GitHub schedule is a late backup. Each day is posted once
# (data/telegram_history/_last_post.json), whoever starts it.
on:
  schedule:
    - cron: "30 7 * * *"   # 13:00 IST backup
  workflow_dispatch:

concurrency:
  group: taazabhav-telegram-broadcast
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  broadcast:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Latest state
        # A run that waited in the queue must see what the run before it saved.
        run: git pull --ff-only origin main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - name: Run Telegram broadcast
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python telegram_broadcast.py
      # if: always(): states posted before a failure keep their history.
      - name: Commit Telegram broadcast price history
        if: always()
        run: |
          git config user.name "TaazaBhav Bot"
          git config user.email "bot@taazabhav.com"
          git add data/telegram_history/
          git diff --staged --quiet || git commit -m "Update Telegram broadcast price history"
          git pull --rebase
          git push
      - name: Tell the owner it failed
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: >
          curl -sS -m 20 "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage"
          --data-urlencode chat_id="${TELEGRAM_CHAT_ID}"
          --data-urlencode text="TaazaBhav ALERT: Telegram channel broadcast failed. ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          || true

name: Daily Telegram Mandi Bhav Broadcast

on:
  schedule:
    # 05:45 IST = 00:15 UTC -- runs after the YouTube videos are already
    # kicked off (those start at 05:00 IST), so it doesn't compete with
    # them for data.gov.in calls at the exact same moment.
    - cron: "15 0 * * *"
  workflow_dispatch:

concurrency:
  group: taazabhav-telegram-broadcast
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  broadcast:
    runs-on: ubuntu-latest
    # Without this, a run that hangs (network stall, an infinite retry,
    # anything) sits "in progress" forever. Because cancel-in-progress is
    # false above, every SUBSEQUENT scheduled run then just queues up
    # behind it and never actually starts -- from the outside this looks
    # exactly like "automate nahi ho raha", even though the workflow file
    # is fine, until someone notices and manually cancels/reruns it.
    #
    # Phase 1A: this script used to make ~125 fully-sequential upstream
    # calls (5 states x 25 commodities) and was observed in production
    # actually hitting this 10-minute ceiling and getting cancelled. It now
    # batches by commodity (25 calls, not 125 -- see telegram_broadcast.py)
    # with modest bounded concurrency, which comfortably restores headroom
    # under this same 10-minute limit even with the new retry logic added
    # on each call; see docs/RELIABILITY.md for the exact worst-case math.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - name: Run Telegram broadcast
        env:
          DATA_GOV_API_KEY: ${{ secrets.DATA_GOV_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python telegram_broadcast.py
      # if: always() -- same reasoning as daily.yml: telegram_broadcast.py
      # now exits non-zero on a real failure, and states that DID succeed
      # earlier in the same run must still have their history committed.
      - name: Commit Telegram broadcast price history
        if: always()
        run: |
          git config user.name "TaazaBhav Bot"
          git config user.email "bot@taazabhav.com"
          git add data/telegram_history/
          git diff --staged --quiet || git commit -m "Update Telegram broadcast price history"
          git pull --rebase
          git push

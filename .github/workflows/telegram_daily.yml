name: Daily Telegram Mandi Bhav Broadcast

on:
  schedule:
    # 05:45 IST = 00:15 UTC -- runs after the YouTube videos are already
    # kicked off (those start at 05:00 IST), so it doesn't compete with
    # them for data.gov.in calls at the exact same moment.
    - cron: "15 0 * * *"
  workflow_dispatch:

concurrency:
  group: taazabhav-telegram-broadcast
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  broadcast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run Telegram broadcast
        env:
          DATA_GOV_API_KEY: ${{ secrets.DATA_GOV_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python telegram_broadcast.py

      - name: Commit Telegram price history
        run: |
          git config user.name "TaazaBhav Bot"
          git config user.email "bot@taazabhav.com"
          git add data/telegram_history/
          git diff --staged --quiet || git commit -m "Update Telegram broadcast price history"
          git pull --rebase
          git push

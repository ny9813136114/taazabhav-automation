name: Kisan Mela Alerts

# "किसान मेला अलर्ट" Shorts from the confirmed Kisan Mela calendar on
# taazabhav.com: 7 days and 1 day before each event. Independent of
# data.gov.in. At most 3 videos a day.
on:
  schedule:
    - cron: "43 11 * * *"   # 17:13 IST
  workflow_dispatch:

concurrency:
  group: taazabhav-melas
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  melas:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Latest state
        # A run that waited in the queue must see what the run before it saved.
        run: git pull --ff-only origin main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -r requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: shorts/package-lock.json
      - name: Install Remotion
        working-directory: shorts
        run: npm ci --no-audit --no-fund && npx remotion browser ensure
      - name: Restore YouTube credentials
        run: |
          echo "${{ secrets.YT_TOKEN_PICKLE_B64 }}" | base64 -d -i > token.pickle
          echo "${{ secrets.YT_CLIENT_SECRET_B64 }}" | base64 -d -i > client_secret.json
      - name: Make mela videos
        env:
          DATA_GOV_API_KEY: ${{ secrets.DATA_GOV_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          META_TOKEN: ${{ secrets.META_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
        run: python mela_video.py
      - name: Commit published list
        if: always()
        run: |
          git config user.name "TaazaBhav Bot"
          git config user.email "bot@taazabhav.com"
          git add data/published_melas.json data/posts 2>/dev/null || true
          git diff --staged --quiet || git commit -m "Update published mela alerts"
          git pull --rebase
          git push
      - name: Tell the owner it failed
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: >
          curl -sS -m 20 "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage"
          --data-urlencode chat_id="${TELEGRAM_CHAT_ID}"
          --data-urlencode text="TaazaBhav ALERT: Kisan Mela video run failed. ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          || true

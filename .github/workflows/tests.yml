name: Tests

# Phase 1A: this repository previously had zero automated tests (only
# manual, unassertive test_*.py smoke scripts meant to be run by hand).
# This workflow runs the new tests/ suite (unittest, stdlib only -- no new
# dependency added) on every push and via manual dispatch, so regressions
# in the reliability-critical paths (retry logic, failure-status
# aggregation, duplicate-upload guard, historical validation) are caught
# before they reach the scheduled production workflows.
on:
  push:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt
      - name: Install system dependencies
        # static: always test the fallback build that install_ffmpeg.sh uses when apt hangs
        env:
          FFMPEG_SOURCE: static
        run: bash ops/install_ffmpeg.sh
      - name: ffmpeg smoke test (libass subtitles + libx264, as the videos use)
        run: |
          printf '[Script Info]\nScriptType: v4.00+\nPlayResX: 320\nPlayResY: 240\n\n[V4+ Styles]\nFormat: Name, Fontname, Fontsize, PrimaryColour, Alignment\nStyle: Default,Noto Sans,24,&H00FFFFFF,2\n\n[Events]\nFormat: Layer, Start, End, Style, Text\nDialogue: 0,0:00:00.00,0:00:01.00,Default,किसान test\n' > /tmp/t.ass
          ffmpeg -hide_banner -loglevel error -f lavfi -i color=c=green:s=320x240:d=1 -vf ass=/tmp/t.ass -c:v libx264 -pix_fmt yuv420p -y /tmp/t.mp4
          ffprobe -v error -show_entries format=duration -of csv=p=0 /tmp/t.mp4
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        env:
          # Dummy value only -- fetch_prices.py reads this at import time,
          # and tests must not depend on (or ever touch) the real secret.
          DATA_GOV_API_KEY: test-key-not-real
        run: python -m unittest discover -s tests -p "test_*.py" -v

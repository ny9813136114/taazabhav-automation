name: Daily Bhav Post (FB + IG)

# One "aaj ke mandi bhav" carousel a day on the Facebook Page + Instagram:
# today's main crops, state-wise price, highest-paying mandis, MSP, from the
# site's own crop reports. PREVIEW (owner's Telegram only) until the repo
# variable BHAV_POSTS_LIVE is "1". Posts nothing on a day without prices.
on:
  schedule:
    - cron: "0 9 * * *"   # 14:30 IST, after the site's ~11:30 IST price pull
  workflow_dispatch:
    inputs:
      mode:
        description: "auto = follow BHAV_POSTS_LIVE; preview = owner's Telegram only; publish = post it"
        default: auto
        type: choice
        options: [auto, preview, publish]

concurrency:
  group: taazabhav-posts
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-24.04  # Playwright 1.56 cannot install chromium on Ubuntu 26 (ubuntu-latest from Oct 2026)
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Latest state
        run: git pull --ff-only origin ${{ github.ref_name }}  # main on schedule; a PR branch when previewing it
      - name: Once per slot
        id: g
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          S=H
          echo "series=$S" >> "$GITHUB_OUTPUT"
          # The Supabase clock starts this at the exact time (ops/supabase-clock.sql); GitHub's own
          # schedule is only a late backup and must not post it a second time. Manual preview/publish runs skip the gate.
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.mode || 'auto' }}" = "auto" ]; then
            python3 -m engine.slot_gate check "$S"
            echo "gated=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: steps.g.outputs.run == 'true'
        with:
          python-version: "3.11"
      - run: pip install requests==2.* playwright==1.56.0 && bash ops/retry.sh "python -m playwright install --with-deps chromium"
        if: steps.g.outputs.run == 'true'
      - name: Post
        if: steps.g.outputs.run == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          META_TOKEN: ${{ secrets.META_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          COMMENTS_LIVE: ${{ vars.COMMENTS_LIVE }}
          META_ON: ${{ vars.META_ON }}
          STORIES_LIVE: ${{ vars.STORIES_LIVE }}
          BHAV_EXTRA_LIVE: ${{ vars.BHAV_EXTRA_LIVE }}
          BHAV_POSTS_LIVE: ${{ vars.BHAV_POSTS_LIVE }}
        run: python -m posts.bhav ${{ (inputs.mode && inputs.mode != 'auto') && inputs.mode || '' }}
      - name: Mark slot done
        if: success() && steps.g.outputs.run == 'true' && steps.g.outputs.gated == 'true'
        run: python3 -m engine.slot_gate done "${{ steps.g.outputs.series }}"
      - name: Commit state
        if: always()
        run: |
          git config user.name "TaazaBhav Bot"
          git config user.email "bot@taazabhav.com"
          git add data/posts data/engine/slots.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "Bhav post: update state"
          git pull --rebase
          git push

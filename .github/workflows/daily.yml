name: Daily TaazaBhav Upload

on:
  schedule:
    # Kisan/vyapari subah jaldi bhav dekhte hain, isliye sab 5 videos
    # 6:00 AM IST se PEHLE ban kar upload ho jaane chahiye. IST is UTC+5:30,
    # so these UTC times land at 5:00 - 5:40 AM IST.
    - cron: "30 23 * * *"  # 05:00 IST -- Uttar Pradesh, Onion
    - cron: "40 23 * * *"  # 05:10 IST -- Maharashtra, Onion
    - cron: "50 23 * * *"  # 05:20 IST -- West Bengal, Potato
    - cron: "0 0 * * *"    # 05:30 IST -- Karnataka, Tomato
    - cron: "10 0 * * *"   # 05:40 IST -- Punjab, Potato
  workflow_dispatch:

concurrency:
  group: taazabhav-daily
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    # Without this, one run that hangs (a stalled network call, an upload
    # that never returns, anything) sits "in progress" indefinitely. Because
    # cancel-in-progress is false above, every SUBSEQUENT scheduled run for
    # ANY of the 5 states then just queues up behind it and never actually
    # starts -- this looks exactly like "automation ruk gaya" from the
    # outside even though the workflow file itself is fine. A normal run
    # (audio + video render + thumbnail + YouTube upload) finishes well
    # under 15 minutes, so 20 is a generous ceiling that only kicks in for a
    # genuinely stuck run. This still comfortably covers the Phase 1A retry
    # budget: worst case, every one of the 5 targets exhausts all retries on
    # a fully-down upstream (~99s each, see fetch_prices.py) -- about 8-9
    # minutes added on top of the ~1 minute of fixed setup steps, nowhere
    # near this ceiling. See docs/RELIABILITY.md for the full analysis.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - name: Restore YouTube credentials
        run: |
          echo "${{ secrets.YT_TOKEN_PICKLE_B64 }}" | base64 -d -i > token.pickle
          echo "${{ secrets.YT_CLIENT_SECRET_B64 }}" | base64 -d -i > client_secret.json
      # Each of the 5 cron schedules above fires this same workflow at a
      # different time. github.event.schedule tells us exactly which one
      # fired, so we can process just that one state/commodity per run --
      # this is what actually spreads the 5 uploads across the morning
      # instead of firing them all back-to-back in one run.
      #
      # A manual "Run workflow" click (workflow_dispatch) has no schedule,
      # so it falls through to the default case below -- main.py then runs
      # every target in TARGETS in one go, same as testing locally.
      - name: Pick today's target from the schedule that fired
        run: |
          case "${{ github.event.schedule }}" in
            "30 23 * * *")
              echo "YT_STATE=Uttar Pradesh" >> "$GITHUB_ENV"
              echo "YT_COMMODITY=Onion" >> "$GITHUB_ENV"
              ;;
            "40 23 * * *")
              echo "YT_STATE=Maharashtra" >> "$GITHUB_ENV"
              echo "YT_COMMODITY=Onion" >> "$GITHUB_ENV"
              ;;
            "50 23 * * *")
              echo "YT_STATE=West Bengal" >> "$GITHUB_ENV"
              echo "YT_COMMODITY=Potato" >> "$GITHUB_ENV"
              ;;
            "0 0 * * *")
              echo "YT_STATE=Karnataka" >> "$GITHUB_ENV"
              echo "YT_COMMODITY=Tomato" >> "$GITHUB_ENV"
              ;;
            "10 0 * * *")
              echo "YT_STATE=Punjab" >> "$GITHUB_ENV"
              echo "YT_COMMODITY=Potato" >> "$GITHUB_ENV"
              ;;
            *)
              echo "Manual run -- no single target set, main.py will process every TARGETS entry."
              ;;
          esac
      - name: Run pipeline
        env:
          DATA_GOV_API_KEY: ${{ secrets.DATA_GOV_API_KEY }}
          YT_LANG: "hi"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py
      # if: always() is deliberate (Phase 1A): main.py now exits non-zero
      # when at least one target had a real failure, so this step would
      # otherwise be SKIPPED by Actions' default if: success() behavior --
      # discarding any OTHER targets in the same run that succeeded and
      # already wrote real price-history/published-state files to disk.
      # Committing must happen regardless of the job's overall pass/fail
      # status; the failure itself is still reported by the job's own exit
      # code (see "Run pipeline" above), not hidden by this step.
      - name: Commit price history
        if: always()
        run: |
          git config user.name "TaazaBhav Bot"
          git config user.email "bot@taazabhav.com"
          git add data/history/ data/published/
          git diff --staged --quiet || git commit -m "Update price history"
          git pull --rebase
          git push

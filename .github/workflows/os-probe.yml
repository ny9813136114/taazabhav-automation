name: OS probe (temporary)
on:
  push:
    branches: [claude/pin-ubuntu-2404]
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - shell: bash
        run: |
          echo "::notice::os $(. /etc/os-release; echo $PRETTY_NAME)"
          pip install -q playwright==1.56.0
          if ! python -m playwright install --with-deps chromium > /tmp/o 2>&1; then
            echo "::error::install failed $(tail -6 /tmp/o | tr '\n' ' ')"
            exit 1
          fi
          echo "::notice::install ok"
